services:
  mysql:
    image: mysql:8.4
    container_name: auction_db
    env_file: release/.env
    ports:
      - "3306:3306"
    volumes:
      - auction_data:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  auction_data:
